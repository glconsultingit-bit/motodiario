        :root{

          --panel2:#1e2124;

        .mono{font-family:'JetBrains Mono',monospace}

          backdrop-filter: blur(14px);

          border-bottom:1px solid var(--border);
          display:flex; align-items:center; justify-content:space-between;
          padding:14px 18px;

        .brand{display:flex; align-items:center; gap:12px}
        .logo{

          border:1px solid var(--border); background:var(--panel);

        .badge.local{color:var(--muted)}
        .btn{
          appearance:none; border:1px solid var(--border); background:var(--panel2);
          color:var(--text); padding:10px 14px; border-radius:10px; font-weight:600;
          cursor:pointer; transition:.18s; font-size:13px; letter-spacing:0.02em;
        }
        .btn:hover{transform:translateY(-1px); border-color:#3a4046}
        .btn:active{transform:translateY(0)}

        .card{
          background: linear-gradient(180deg, var(--panel) 0%, #15171a 100%);
          border:1px solid var(--border); border-radius:var(--radius);
          box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);

          display:flex; align-items:center; gap:8px; letter-spacing:0.02em;
        }

        .tab{padding:8px 14px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; color:var(--muted); transition:.15s; text-transform:uppercase; letter-spacing:0.05em; font-family:Oswald}
        .tab.active{background:var(--text); color:#000}
        .kpi{display:flex; flex-direction:column; gap:4px}

        .expense-row{display:grid; grid-template-columns:1fr auto; gap:12px; padding:12px 14px; border-bottom:1px solid var(--border); align-items:center}
        .expense-row:last-child{border-bottom:0}

        .scroll{overflow:auto}
